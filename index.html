<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>DSE Pulse – Dhaka Stock Exchange tracker &amp; signals</title>
<meta name="description" content="Dhaka Stock Exchange (DSE) market dashboard with charts, screener and rule-based Buy / Hold / Sell signals.">
<meta name="theme-color" content="#0b7a6b">

<style>
:root {
  --bg: #f4f6f9; --card: #ffffff; --fg: #0f172a; --muted: #64748b; --line: #e3e8ef; --soft: #eef2f7;
  --accent: #0b7a6b; --accent-fg: #fff; --up: #0f9d58; --down: #e5393f; --warn: #b45309;
  --sb: #0b7a3f; --b: #19a35a; --h: #7b8794; --s: #e0622f; --ss: #c62828;
  --r: 14px; --shadow: 0 1px 2px rgba(15,23,42,.05), 0 6px 20px rgba(15,23,42,.05);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans Bengali", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
[data-theme="dark"] {
  --bg: #0c1117; --card: #151c25; --fg: #e8edf3; --muted: #8b98a8; --line: #263140; --soft: #1c2530;
  --accent: #2dd4bf; --accent-fg: #06201c; --up: #34d17a; --down: #ff6b70; --warn: #fbbf24;
  --sb: #22c55e; --b: #4ade80; --h: #94a3b8; --s: #fb923c; --ss: #f87171; --shadow: none;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
h1, h2, h3 { margin: 0 0 .5em; line-height: 1.25; letter-spacing: -.01em; }
h1 { font-size: 1.45rem; } h2 { font-size: 1.1rem; } h3 { font-size: .95rem; }
p { margin: 0 0 .7em; }
.muted { color: var(--muted); } .small { font-size: .82rem; } .num { font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; } .sp { flex: 1; }

/* header */
.top { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
.top-in { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 9px 14px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.1rem; color: var(--fg); letter-spacing: -.02em; white-space: nowrap; }
.logo { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; }
.search { position: relative; flex: 1; max-width: 420px; margin-left: auto; }
.search input { width: 100%; padding: 9px 12px 9px 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--soft); outline: none; }
.search input:focus { border-color: var(--accent); background: var(--card); }
.search .mag { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.sugg { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.18); overflow: hidden; z-index: 40; }
.sugg a { display: flex; gap: 10px; padding: 9px 12px; color: var(--fg); border-bottom: 1px solid var(--line); align-items: center; }
.sugg a:last-child { border: 0; } .sugg a:hover, .sugg a.act { background: var(--soft); }
.sugg b { min-width: 86px; } .sugg span { color: var(--muted); font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; font-size: 1.05rem; }
.nav { max-width: 1240px; margin: 0 auto; display: none; gap: 4px; padding: 0 14px 8px; }
.nav a { padding: 7px 14px; border-radius: 9px; color: var(--muted); font-weight: 600; }
.nav a:hover { background: var(--soft); } .nav a.on { background: var(--accent); color: var(--accent-fg); }
.bottom { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; display: flex; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.bottom a { flex: 1; text-align: center; padding: 8px 0 7px; font-size: .68rem; color: var(--muted); font-weight: 600; }
.bottom a i { display: block; font-style: normal; font-size: 1.2rem; line-height: 1.2; } .bottom a.on { color: var(--accent); }
@media (max-width: 859px) { .top-in { flex-wrap: wrap; row-gap: 8px; } .brand { order: 1; } #status { order: 2; margin-left: auto; } #themeBtn { order: 3; } .search { order: 4; flex-basis: 100%; max-width: none; margin-left: 0; } }
@media (min-width: 860px) { .nav { display: flex; } .bottom { display: none; } main { padding-bottom: 40px !important; } }

main { max-width: 1240px; margin: 0 auto; padding: 14px 14px 92px; }
.chip-status { font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.chip-status.open { background: color-mix(in srgb, var(--up) 16%, transparent); color: var(--up); }
.banner { background: color-mix(in srgb, var(--warn) 14%, var(--card)); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); color: var(--fg); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; font-size: .88rem; }

/* cards & grids */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); margin-bottom: 14px; }
.card > h2:first-child, .card > .head:first-child { margin-bottom: 10px; }
.head { display: flex; align-items: center; gap: 8px; } .head h2 { margin: 0; }
.grid { display: grid; gap: 14px; } .g2 { grid-template-columns: 1fr; } .g3 { grid-template-columns: 1fr; }
@media (min-width: 760px) { .g2 { grid-template-columns: 1fr 1fr; } .g3 { grid-template-columns: repeat(3, 1fr); } }
.g2 > .card, .g3 > .card { margin: 0; }
.strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.ix { flex: 1 0 170px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: flex; justify-content: space-between; gap: 6px; align-items: center; color: var(--fg); }
.ix b { display: block; font-size: .78rem; color: var(--muted); } .ix .v { font-size: 1.15rem; font-weight: 800; }
.spark { display: block; }

/* badges */
.sig { display: inline-block; font-size: .7rem; font-weight: 800; letter-spacing: .02em; padding: 3px 9px; border-radius: 6px; color: #fff; white-space: nowrap; }
.sig.SB { background: var(--sb); } .sig.B { background: var(--b); } .sig.H { background: var(--h); } .sig.S { background: var(--s); } .sig.SS { background: var(--ss); } .sig.NA { background: var(--h); }
[data-theme="dark"] .sig { color: #04130b; }
.tag { font-size: .7rem; padding: 2px 8px; border-radius: 6px; background: var(--soft); color: var(--muted); font-weight: 600; }

/* tables */
.tw { overflow-x: auto; margin: 0 -14px; padding: 0 14px; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 9px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; padding-left: 2px; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; user-select: none; position: sticky; top: 0; background: var(--card); }
th.sortable { cursor: pointer; } th.sortable:hover { color: var(--fg); } th .ar { font-size: .65rem; }
tr:last-child td { border-bottom: 0; }
tbody tr.link { cursor: pointer; } tbody tr.link:hover td { background: var(--soft); }
td .sym { font-weight: 800; display: block; } td .nm { font-size: .74rem; color: var(--muted); max-width: 170px; overflow: hidden; text-overflow: ellipsis; display: block; }
.hide-s { display: none; } @media (min-width: 760px) { .hide-s { display: table-cell; } }
.hide-m { display: none; } @media (min-width: 1000px) { .hide-m { display: table-cell; } }
.star { background: none; border: 0; font-size: 1.15rem; color: var(--muted); padding: 2px 6px; } .star.on { color: #f5b301; }

.mini li { list-style: none; display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.mini { margin: 0; padding: 0; } .mini li:last-child { border: 0; } .mini b { flex: 1; } .mini .nm { color: var(--muted); font-size: .76rem; font-weight: 400; display: block; }
.bar { height: 10px; border-radius: 99px; overflow: hidden; display: flex; background: var(--soft); } .bar i { display: block; height: 100%; }
.sector { display: grid; grid-template-columns: 130px 1fr 60px; gap: 8px; align-items: center; padding: 4px 0; font-size: .86rem; }
.sector .track { height: 8px; background: var(--soft); border-radius: 99px; position: relative; } .sector .fill { position: absolute; top: 0; bottom: 0; border-radius: 99px; }

/* controls */
.seg { display: inline-flex; background: var(--soft); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 8px; font-size: .82rem; font-weight: 700; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.field { padding: 8px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); min-width: 0; }
.btn { border: 0; border-radius: 10px; padding: 9px 15px; font-weight: 700; background: var(--accent); color: var(--accent-fg); }
.btn.ghost { background: var(--soft); color: var(--fg); } .btn.sm { padding: 5px 10px; font-size: .82rem; } .btn.danger { background: var(--ss); color: #fff; }
.toggle { display: inline-flex; align-items: center; gap: 5px; font-size: .82rem; color: var(--muted); } .toggle input { accent-color: var(--accent); }

/* stock detail */
.hero { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
.hero .price { font-size: 2rem; font-weight: 800; line-height: 1.1; }
.verdict { border-radius: var(--r); padding: 16px; border: 1px solid var(--line); background: var(--card); }
.verdict .big { font-size: 1.6rem; font-weight: 900; letter-spacing: -.02em; }
.gauge { position: relative; height: 12px; border-radius: 99px; margin: 14px 0 4px; background: linear-gradient(90deg, var(--ss), var(--s), var(--h), var(--b), var(--sb)); }
.gauge i { position: absolute; top: -4px; width: 4px; height: 20px; background: var(--fg); border-radius: 2px; transform: translateX(-2px); }
.gl { display: flex; justify-content: space-between; font-size: .68rem; color: var(--muted); }
.parts { margin: 12px 0 0; padding: 0; } .parts li { list-style: none; padding: 8px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 82px 1fr 52px; gap: 8px; align-items: center; font-size: .86rem; }
.parts .pn { font-weight: 700; } .parts .pt { color: var(--muted); font-size: .8rem; grid-column: 1 / -1; margin-top: -4px; }
.pbar { height: 6px; background: var(--soft); border-radius: 99px; position: relative; } .pbar i { position: absolute; top: 0; bottom: 0; border-radius: 99px; }
.pbar:after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); opacity: .5; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
@media (min-width: 560px) { .stats { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 559px) { .stats div:last-child:nth-child(odd) { grid-column: 1 / -1; } }
.stats div { background: var(--card); padding: 9px 12px; } .stats span { display: block; font-size: .72rem; color: var(--muted); } .stats b { font-size: .98rem; }
.chartbox { position: relative; width: 100%; height: 360px; } .chartbox.big { height: 520px; } .chartbox.sm { height: 220px; }
.chartbox canvas { width: 100%; height: 100%; display: block; touch-action: pan-y; }
.tip { min-height: 1.4em; font-size: .78rem; color: var(--muted); margin-bottom: 4px; }
.levels { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; } @media (min-width: 560px) { .levels { grid-template-columns: repeat(4, 1fr); } }
.lv { border-radius: 10px; padding: 10px; background: var(--soft); } .lv span { font-size: .72rem; color: var(--muted); display: block; } .lv b { font-size: 1.05rem; }
.disc { font-size: .78rem; color: var(--muted); border-top: 1px solid var(--line); margin-top: 22px; padding-top: 12px; }
.empty { padding: 26px 8px; text-align: center; color: var(--muted); }
form.add { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; } form.add .btn { grid-column: 1 / -1; }
@media (min-width: 700px) { form.add { grid-template-columns: 2fr 1fr 1fr auto; } form.add .btn { grid-column: auto; } }
details summary { cursor: pointer; font-weight: 700; }
.kpi { display: flex; gap: 22px; flex-wrap: wrap; } .kpi div b { font-size: 1.25rem; display: block; } .kpi span { font-size: .76rem; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: 84px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: .86rem; transition: .25s; z-index: 80; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 860px) { .toast { bottom: 24px; } }

</style>

<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/market"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-7 4 3 8-9"/></svg></span>DSE&nbsp;Pulse</a>
    <div class="search"><span class="mag">&#128269;</span><input id="q" type="search" placeholder="Search symbol or company…" autocomplete="off" aria-label="Search stocks"><div id="sugg" class="sugg" hidden></div></div>
    <span id="status" class="chip-status"></span>
    <button class="icon" id="themeBtn" aria-label="Change theme" title="Theme: auto / dark / light">&#127763;</button>
  </div>
  <nav class="nav" id="nav"></nav>
</header>
<main id="view"><div class="empty">Loading market data…</div></main>

<script>
/* ===== Indicators + signal engine (no dependencies) ===== */
const Ind = (function () {
  "use strict";
  const isN = function (x) { return typeof x === "number" && !isNaN(x); };

  function sma(a, n) {
    const out = new Array(a.length).fill(NaN); let s = 0;
    for (let i = 0; i < a.length; i++) { s += a[i]; if (i >= n) s -= a[i - n]; if (i >= n - 1) out[i] = s / n; }
    return out;
  }
  function ema(a, n) {
    const out = new Array(a.length).fill(NaN), k = 2 / (n + 1); let prev = NaN;
    for (let i = 0; i < a.length; i++) {
      if (i === n - 1) { let s = 0; for (let j = 0; j < n; j++) s += a[j]; prev = s / n; out[i] = prev; }
      else if (i >= n) { prev = a[i] * k + prev * (1 - k); out[i] = prev; }
    }
    return out;
  }
  function rsi(c, n) {
    n = n || 14; const out = new Array(c.length).fill(NaN);
    if (c.length <= n) return out;
    let g = 0, l = 0;
    for (let i = 1; i <= n; i++) { const d = c[i] - c[i - 1]; if (d >= 0) g += d; else l -= d; }
    g /= n; l /= n; out[n] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
    for (let i = n + 1; i < c.length; i++) {
      const d = c[i] - c[i - 1];
      g = (g * (n - 1) + (d > 0 ? d : 0)) / n; l = (l * (n - 1) + (d < 0 ? -d : 0)) / n;
      out[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
    }
    return out;
  }
  function macd(c) {
    const e12 = ema(c, 12), e26 = ema(c, 26), n = c.length;
    const line = new Array(n).fill(NaN), sig = new Array(n).fill(NaN), hist = new Array(n).fill(NaN);
    for (let i = 0; i < n; i++) if (isN(e12[i]) && isN(e26[i])) line[i] = e12[i] - e26[i];
    const first = line.findIndex(isN);
    if (first >= 0) {
      const s = ema(line.slice(first), 9);
      for (let i = 0; i < s.length; i++) if (isN(s[i])) { sig[first + i] = s[i]; hist[first + i] = line[first + i] - s[i]; }
    }
    return { line: line, signal: sig, hist: hist };
  }
  function bollinger(c, n, k) {
    n = n || 20; k = k || 2;
    const mid = sma(c, n), up = new Array(c.length).fill(NaN), low = new Array(c.length).fill(NaN);
    for (let i = n - 1; i < c.length; i++) {
      let s = 0; for (let j = i - n + 1; j <= i; j++) { const d = c[j] - mid[i]; s += d * d; }
      const sd = Math.sqrt(s / n); up[i] = mid[i] + k * sd; low[i] = mid[i] - k * sd;
    }
    return { mid: mid, up: up, low: low };
  }
  function atr(h, l, c, n) {
    n = n || 14; const out = new Array(c.length).fill(NaN); if (c.length <= n) return out;
    const tr = function (i) { return Math.max(h[i] - l[i], Math.abs(h[i] - c[i - 1]), Math.abs(l[i] - c[i - 1])); };
    let a = 0; for (let i = 1; i <= n; i++) a += tr(i); a /= n; out[n] = a;
    for (let i = n + 1; i < c.length; i++) { a = (a * (n - 1) + tr(i)) / n; out[i] = a; }
    return out;
  }

  /* Pre-compute every indicator once per stock */
  function prepare(S) {
    const c = S.c, P = { n: c.length, c: c, h: S.h, l: S.l, o: S.o, v: S.v };
    P.sma20 = sma(c, 20); P.sma50 = sma(c, 50); P.sma200 = sma(c, 200);
    P.rsi = rsi(c, 14);
    const m = macd(c); P.macd = m.line; P.sig = m.signal; P.hist = m.hist;
    const b = bollinger(c, 20, 2); P.bbU = b.up; P.bbM = b.mid; P.bbL = b.low;
    P.atr = atr(S.h, S.l, c, 14);
    P.vavg = sma(S.v, 20);
    return P;
  }

  const TH = { strongBuy: 55, buy: 25, sell: -25, strongSell: -55 };
  function classify(score) {
    if (score >= TH.strongBuy) return "STRONG BUY";
    if (score >= TH.buy) return "BUY";
    if (score <= TH.strongSell) return "STRONG SELL";
    if (score <= TH.sell) return "SELL";
    return "HOLD";
  }

  /* Score one day (index i). Each part has a max so scores normalise to -100..+100. */
  function scoreAt(P, i) {
    const c = P.c[i], parts = [];
    const add = function (k, pts, max, text) { if (max > 0) parts.push({ k: k, pts: pts, max: max, text: text }); };

    // 1) Trend (max 30)
    let t = 0, tm = 0; const tt = [];
    if (isN(P.sma50[i])) { tm += 10; if (c > P.sma50[i]) { t += 10; tt.push("price above its 50-day average"); } else { t -= 10; tt.push("price below its 50-day average"); } }
    if (isN(P.sma50[i]) && isN(P.sma20[i])) { tm += 10; if (P.sma20[i] > P.sma50[i]) { t += 10; tt.push("20-day average is above the 50-day (short-term uptrend)"); } else { t -= 10; tt.push("20-day average is below the 50-day (short-term downtrend)"); } }
    if (isN(P.sma200[i])) { tm += 10; if (c > P.sma200[i]) { t += 10; tt.push("price above its 200-day average (long-term uptrend)"); } else { t -= 10; tt.push("price below its 200-day average (long-term downtrend)"); } }
    add("Trend", t, tm, tt.join("; "));

    // 2) MACD momentum (max 20)
    if (isN(P.hist[i]) && i > 0 && isN(P.hist[i - 1])) {
      let m = 0; const mt = [];
      if (P.hist[i] > 0) { m += 10; mt.push("MACD is above its signal line"); } else { m -= 10; mt.push("MACD is below its signal line"); }
      if (P.hist[i] > P.hist[i - 1]) { m += 5; mt.push("momentum is strengthening"); } else { m -= 5; mt.push("momentum is fading"); }
      for (let j = Math.max(1, i - 2); j <= i; j++) {
        if (isN(P.hist[j - 1]) && P.hist[j - 1] <= 0 && P.hist[j] > 0) { m += 5; mt.push("fresh bullish crossover"); break; }
        if (isN(P.hist[j - 1]) && P.hist[j - 1] >= 0 && P.hist[j] < 0) { m -= 5; mt.push("fresh bearish crossover"); break; }
      }
      add("MACD", Math.max(-20, Math.min(20, m)), 20, mt.join("; "));
    }

    // 3) RSI (max 15)
    const r = P.rsi[i];
    if (isN(r)) {
      let p, txt;
      if (r < 30) { p = 15; txt = "RSI " + r.toFixed(0) + ": oversold, a rebound is more likely"; }
      else if (r < 45) { p = -5; txt = "RSI " + r.toFixed(0) + ": weak momentum"; }

    if (t.dataset && t.dataset.act === "tg") X.tg(t);
    else if (t.id === "sec") { S.sector = t.value; S.limit = 60; save(); render(true); }
  });
  document.addEventListener("input", function (e) {
    const t = e.target;
    if (t.id === "flt") { S.filter = t.value; S.limit = 60; const p = t.selectionStart; render(true); const n = $("#flt"); if (n) { n.focus(); try { n.setSelectionRange(p, p); } catch (x) { /* ignore */ } } }
    else if (t.id === "q") suggest(t.value);
  });
  document.addEventListener("submit", function (e) {
    if (e.target.id !== "addHold") return; e.preventDefault();
    const f = e.target, sym = f.sym.value.trim().toUpperCase(), qty = parseFloat(f.qty.value), price = parseFloat(f.price.value);
    if (!M.bySym[sym]) return toast("“" + sym + "” not found. Pick a symbol from the list.");
    if (!(qty > 0) || !(price > 0)) return toast("Enter a valid quantity and price.");
    S.hold.push({ sym: sym, qty: qty, price: price }); save(); toast(sym + " added"); render(true);
  });
  document.addEventListener("keydown", function (e) {
    if (e.target.id === "q" && e.key === "Enter") { const a = document.querySelector("#sugg a[href]"); if (a) { location.hash = a.getAttribute("href"); e.target.value = ""; $("#sugg").hidden = true; e.target.blur(); } }
    if (e.key === "Escape") $("#sugg").hidden = true;
  });
  document.addEventListener("pointerdown", function (e) { if (!e.target.closest(".search")) $("#sugg").hidden = true; else if (e.target.closest("#sugg a")) setTimeout(function () { $("#sugg").hidden = true; $("#q").value = ""; }, 0); });
  window.addEventListener("hashchange", function () { render(); });
  $("#themeBtn").addEventListener("click", X.theme);
  if (window.matchMedia) { const mq = matchMedia("(prefers-color-scheme: dark)"); if (mq.addEventListener) mq.addEventListener("change", function () { if (S.theme === "auto") { applyTheme(); render(true); } }); }

  /* ---------- boot ---------- */
  function boot(model) {
    M = model;
    M.stocks.forEach(function (s) { A[s.sym] = Ind.analyze(s, false); });
    Object.keys(M.indices).forEach(function (k) { IXA[k] = Ind.analyze(M.indices[k], false); });
    if (!M.indices[S.ix]) S.ix = Object.keys(M.indices)[0];
    chrome(); render(); setInterval(refreshStatus, 60000);
  }
  applyTheme();
  return { boot: boot, _debug: function () { return { M: M, A: A, S: S }; } };
})();

Data.load().then(App.boot).catch(function (e) { document.getElementById("view").innerHTML = '<div class="empty"><h2>Could not start</h2><p>' + String(e && e.message || e) + "</p></div>"; });

</script>
</body>
